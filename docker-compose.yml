# Local Postgres for development. Production uses Supabase (or any Postgres host).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: golden_tide
    ports:
      - "54329:5432"
    volumes:
      - gtr_pg:/var/lib/postgresql/data
volumes:
  gtr_pg:
